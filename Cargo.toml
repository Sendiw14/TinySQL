[workspace]
resolver = "3"
members = ["crates/tinysql-engine", "crates/tinysql-cli", "crates/tinysql-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
